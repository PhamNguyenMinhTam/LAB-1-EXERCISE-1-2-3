
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flip Card Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Flip Card Gallery</h1>
    <p>Hover a card to see the back</p>

    <div class="gallery">
        <div class="card">
            <div class="inner">
                <div class="front">
                    <div class="icon">📡</div>
                    <h2>HTML</h2>
                </div>
                <div class="back">
                    <h2>HTML</h2>
                    <p>HTML is used to create the structure of web pages.</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="inner">
                <div class="front">
                    <div class="icon">🎨</div>
                    <h2>CSS</h2>
                </div>
                <div class="back">
                    <h2>CSS</h2>
                    <p>CSS is used to style web pages.</p>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="inner">
                <div class="front">
                    <div class="icon">⚡</div>
                    <h2>JavaScript</h2>
                </div>
                <div class="back">
                    <h2>JavaScript</h2>
                    <p>JavaScript makes web pages interactive.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
