
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Infinite Scrolling Marquee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Infinite Scrolling Marquee</h2>
        <p>Hover to pause the animation</p>

        <div class="marquee">
            <div class="track">
                <div class="group">
                    <span>CSS</span>
                    <span>JavaScript</span>
                    <span>Git</span>
                    <span>GitHub</span>
                    <span>VS Code</span>
                    <span>HTML</span>
                </div>

                <div class="group">
                    <span>CSS</span>
                    <span>JavaScript</span>
                    <span>Git</span>
                    <span>GitHub</span>
                    <span>VS Code</span>
                    <span>HTML</span>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
